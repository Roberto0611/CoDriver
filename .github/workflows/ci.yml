name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python · lint, format, types, tests, deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (ruff)
        run: ruff format --check .

      - name: Types (mypy)
        run: mypy

      - name: Tests (pytest)
        run: pytest

      - name: Dependencies resolve without conflicts
        run: pip check

      - name: Dependencies have no known vulnerabilities
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      - name: No file over 500 lines
        run: python scripts/max_lines.py .

  frontend:
    name: Frontend · lint, format, types, tests, build, deps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (lockfile must be in sync)
        run: npm ci

      - name: Dependencies have no known vulnerabilities
        run: npm audit --audit-level=high

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format (prettier)
        run: npm run format:check

      - name: Types (tsc)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm test

      - name: No file over 500 lines
        run: python3 ../scripts/max_lines.py src

      - name: Build (vite)
        run: npm run build
