name: Setup toolchains
description: Python 3.11 + Node 24 con cache, y las dependencias instaladas.

inputs:
  python:
    description: Instalar Python y requirements
    default: "true"
  node:
    description: Instalar Node y npm ci
    default: "true"

runs:
  using: composite
  steps:
    - name: Python
      if: inputs.python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: pip install
      if: inputs.python == 'true'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Node
      if: inputs.node == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: npm ci
      if: inputs.node == 'true'
      shell: bash
      working-directory: frontend
      run: npm ci
